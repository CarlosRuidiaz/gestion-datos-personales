# Gestión de Datos Personales: orquestación de contenedores (sección 10 del diseño).
#
# Estado: están los diez contenedores del diseño (desde la tarea T14). Cada bloque indica la
# tarea del tablero de CONTEXTO.md que lo agregó.
#
# Arranque:  cp .env.example .env   (completar contraseñas)
#            docker compose --profile consultar up -d --build

name: gestion-datos-personales

networks:
  # Conecta el gateway con el frontend, Keycloak, n8n y los microservicios.
  frontal:
    name: gdp_frontal
  # Conecta PostgreSQL solo con los microservicios y n8n. El gateway y el frontend no entran aquí.
  datos:
    name: gdp_datos

volumes:
  pgdata:
  n8n_data:
  keycloak_data:

services:
  gateway:
    image: traefik:v3.6
    restart: unless-stopped
    command:
      - --providers.docker=true
      # Solo se publican los contenedores que tengan la etiqueta traefik.enable=true.
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=gdp_frontal
      - --entrypoints.web.address=:80
      - --ping=true
      - --accesslog=true
    ports:
      - "80:80"
    volumes:
      # Traefik lee los contenedores activos para crear y quitar rutas en tiempo real (DD-04).
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - frontal
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gestion_personas}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD. Copia .env.example como .env y complétalo}
      TZ: ${TZ:-America/Bogota}
      # Contraseñas de los usuarios por servicio: las asigna database/init-usuarios.sh.
      DB_PASSWORD_CREAR: ${DB_PASSWORD_CREAR:?Falta DB_PASSWORD_CREAR en .env}
      DB_PASSWORD_MODIFICAR: ${DB_PASSWORD_MODIFICAR:?Falta DB_PASSWORD_MODIFICAR en .env}
      DB_PASSWORD_CONSULTAR: ${DB_PASSWORD_CONSULTAR:?Falta DB_PASSWORD_CONSULTAR en .env}
      DB_PASSWORD_BORRAR: ${DB_PASSWORD_BORRAR:?Falta DB_PASSWORD_BORRAR en .env}
      DB_PASSWORD_LOG: ${DB_PASSWORD_LOG:?Falta DB_PASSWORD_LOG en .env}
      DB_PASSWORD_N8N: ${DB_PASSWORD_N8N:?Falta DB_PASSWORD_N8N en .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Se ejecutan en orden y solo la primera vez, cuando el volumen pgdata está vacío.
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./database/init-usuarios.sh:/docker-entrypoint-initdb.d/02-init-usuarios.sh:ro
    # Sin "ports": la base de datos no se publica fuera de la red interna (sección 9 del diseño).
    networks:
      - datos
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.8
    restart: unless-stopped
    # Modo de desarrollo (HTTP, base de datos interna en el volumen). Importa keycloak/realm.json
    # solo si el realm todavía no existe.
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Falta KEYCLOAK_ADMIN_PASSWORD en .env}
      # URL pública fija: es el emisor (iss) de todos los tokens. Los microservicios pueden
      # llegar por la red interna (http://keycloak:8080) para leer las llaves públicas.
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8080}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
      # Contraseñas de los usuarios de prueba: realm.json las toma de aquí al importarse.
      KEYCLOAK_USUARIO_ADMIN_PASSWORD: ${KEYCLOAK_USUARIO_ADMIN_PASSWORD:?Falta KEYCLOAK_USUARIO_ADMIN_PASSWORD en .env}
      KEYCLOAK_USUARIO_CONSULTOR_PASSWORD: ${KEYCLOAK_USUARIO_CONSULTOR_PASSWORD:?Falta KEYCLOAK_USUARIO_CONSULTOR_PASSWORD en .env}
    ports:
      - "8080:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro
    networks:
      - frontal
    healthcheck:
      # La imagen no trae curl: se consulta /health/ready del puerto de gestión con bash.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"status\": \"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  ms-crear:
    build:
      context: .                      # contexto en la raíz: necesita libs/common y package-lock.json
      dockerfile: services/ms-crear/Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-gestion_personas}
      DB_USER: usr_crear
      DB_PASSWORD: ${DB_PASSWORD_CREAR:?Falta DB_PASSWORD_CREAR en .env}
      KEYCLOAK_PUBLIC_URL: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8080}
      KEYCLOAK_INTERNAL_URL: ${KEYCLOAK_INTERNAL_URL:-http://keycloak:8080}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-gestion-personas}
      TZ: ${TZ:-America/Bogota}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - frontal
      - datos
    labels:
      - traefik.enable=true
      - traefik.http.routers.ms-crear.rule=PathPrefix(`/api/crear`)
      - traefik.http.routers.ms-crear.entrypoints=web
      - traefik.http.services.ms-crear.loadbalancer.server.port=3000

  ms-modificar:
    build:
      context: .
      dockerfile: services/ms-modificar/Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-gestion_personas}
      DB_USER: usr_modificar
      DB_PASSWORD: ${DB_PASSWORD_MODIFICAR:?Falta DB_PASSWORD_MODIFICAR en .env}
      KEYCLOAK_PUBLIC_URL: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8080}
      KEYCLOAK_INTERNAL_URL: ${KEYCLOAK_INTERNAL_URL:-http://keycloak:8080}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-gestion-personas}
      TZ: ${TZ:-America/Bogota}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - frontal
      - datos
    labels:
      - traefik.enable=true
      - traefik.http.routers.ms-modificar.rule=PathPrefix(`/api/modificar`)
      - traefik.http.routers.ms-modificar.entrypoints=web
      - traefik.http.services.ms-modificar.loadbalancer.server.port=3000

  ms-borrar:
    build:
      context: .                      # contexto en la raíz: necesita libs/common y package-lock.json
      dockerfile: services/ms-borrar/Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-gestion_personas}
      DB_USER: usr_borrar
      DB_PASSWORD: ${DB_PASSWORD_BORRAR:?Falta DB_PASSWORD_BORRAR en .env}
      KEYCLOAK_PUBLIC_URL: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8080}
      KEYCLOAK_INTERNAL_URL: ${KEYCLOAK_INTERNAL_URL:-http://keycloak:8080}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-gestion-personas}
      TZ: ${TZ:-America/Bogota}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - frontal
      - datos
    labels:
      - traefik.enable=true
      - traefik.http.routers.ms-borrar.rule=PathPrefix(`/api/borrar`)
      - traefik.http.routers.ms-borrar.entrypoints=web
      - traefik.http.services.ms-borrar.loadbalancer.server.port=3000

  # --- T10: ms-log. Consulta del log (los dos roles) y registro de las consultas
  #     en lenguaje natural que envía n8n con su llave de API (N8N_LOG_API_KEY).
  ms-log:
    build:
      context: .                      # contexto en la raíz: necesita libs/common y package-lock.json
      dockerfile: services/ms-log/Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-gestion_personas}
      DB_USER: usr_log
      DB_PASSWORD: ${DB_PASSWORD_LOG:?Falta DB_PASSWORD_LOG en .env}
      KEYCLOAK_PUBLIC_URL: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8080}
      KEYCLOAK_INTERNAL_URL: ${KEYCLOAK_INTERNAL_URL:-http://keycloak:8080}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-gestion-personas}
      N8N_LOG_API_KEY: ${N8N_LOG_API_KEY:?Falta N8N_LOG_API_KEY en .env}
      TZ: ${TZ:-America/Bogota}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - frontal
      - datos
    labels:
      - traefik.enable=true
      - traefik.http.routers.ms-log.rule=PathPrefix(`/api/log`)
      - traefik.http.routers.ms-log.entrypoints=web
      - traefik.http.services.ms-log.loadbalancer.server.port=3000

  # ---------------------------------------------------------------------------
  # Servicios pendientes. Son un punto de partida: quien haga la tarea ajusta
  # imagen, variables y etiquetas, y registra en la sección 7 de CONTEXTO.md lo
  # que se aparte del diseño.
  # ---------------------------------------------------------------------------

  # --- T08: ms-consultar (perfil propio: se habilita y deshabilita según demanda, DD-04)
  # Arranca solo con --profile consultar. Sin container_name, para poder escalar:
  #   docker compose --profile consultar up -d --build      # arrancar todo
  #   docker compose stop ms-consultar                       # deshabilitar Consultar
  #   docker compose up -d ms-consultar                      # habilitar Consultar
  #   docker compose up -d --scale ms-consultar=3 ms-consultar  # tres réplicas
  ms-consultar:
    profiles: ["consultar"]
    build:
      context: .
      dockerfile: services/ms-consultar/Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-gestion_personas}
      DB_USER: usr_consultar
      DB_PASSWORD: ${DB_PASSWORD_CONSULTAR:?Falta DB_PASSWORD_CONSULTAR en .env}
      KEYCLOAK_PUBLIC_URL: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8080}
      KEYCLOAK_INTERNAL_URL: ${KEYCLOAK_INTERNAL_URL:-http://keycloak:8080}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-gestion-personas}
      TZ: ${TZ:-America/Bogota}
    # Traefik solo envía peticiones a las réplicas que ya pasaron este chequeo.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/consultar/health"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 20s
      start_interval: 1s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - frontal
      - datos
    labels:
      - traefik.enable=true
      - traefik.http.routers.ms-consultar.rule=PathPrefix(`/api/consultar`)
      - traefik.http.routers.ms-consultar.entrypoints=web
      - traefik.http.services.ms-consultar.loadbalancer.server.port=3000

  # --- T11: frontend (React servido con Nginx) ----------------------------------
  # Atiende todo lo que no es /api. config.js se genera al arrancar con estas variables.
  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      KEYCLOAK_PUBLIC_URL: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8080}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-gestion-personas}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-frontend}
      N8N_CHAT_URL: ${N8N_CHAT_URL:-}
    networks:
      - frontal
    labels:
      - traefik.enable=true
      # Nunca atiende /api: si un microservicio está apagado (ms-consultar), su ruta debe
      # responder 404 desde Traefik y no la página de la aplicación con un 200.
      - traefik.http.routers.frontend.rule=PathPrefix(`/`) && !PathPrefix(`/api`)
      - traefik.http.routers.frontend.entrypoints=web
      - traefik.http.routers.frontend.priority=1
      - traefik.http.services.frontend.loadbalancer.server.port=80

  # --- T14: n8n ----------------------------------------------------------------
  # Chat RAG (T15) e indexación de embeddings. Sus flujos y credenciales viven en n8n_data;
  # la primera vez se cargan con «bash n8n/configurar.sh» (ver n8n/README.md).
  # Se conecta a PostgreSQL como usr_n8n: solo lee vista_personas y administra persona_embedding.
  n8n:
    image: n8nio/n8n:2.48.7
    restart: unless-stopped
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Falta N8N_ENCRYPTION_KEY en .env}
      GENERIC_TIMEZONE: ${TZ:-America/Bogota}
      TZ: ${TZ:-America/Bogota}
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_WEBHOOK_URL: http://localhost:5678/
      # Despliegue local por HTTP: sin esto el navegador no guarda la cookie de sesión.
      N8N_SECURE_COOKIE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      # Flujos exportados, para que configurar.sh los importe con la CLI de n8n.
      - ./n8n/workflows:/workflows:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5678/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - frontal
      - datos
