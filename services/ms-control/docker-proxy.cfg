# Configuración de docker-proxy (tecnativa/docker-socket-proxy), tarea T24.
# Reemplaza la plantilla de la imagen para dejar pasar SOLO tres peticiones al Docker Engine:
#   GET  /containers/json             listar contenedores
#   POST /containers/{id}/stop        detener
#   POST /containers/{id}/start       arrancar
# Todo lo demás (crear contenedores, exec, imágenes, volúmenes, inspeccionar...) responde 403.
# La imagen cambia ${BIND_CONFIG} al arrancar.

global
    log stdout format raw daemon info
    pidfile /run/haproxy.pid
    maxconn 1000

defaults
    mode http
    log global
    option httplog
    option dontlognull
    option http-server-close
    timeout http-request 10s
    timeout connect 10s
    timeout client 1m
    timeout server 1m

backend dockerbackend
    server dockersocket /var/run/docker.sock

frontend dockerfrontend
    bind ${BIND_CONFIG}
    http-request allow if METH_GET { path,url_dec -m reg -i ^(/v[0-9.]+)?/containers/json$ }
    http-request allow if METH_POST { path,url_dec -m reg -i ^(/v[0-9.]+)?/containers/[a-zA-Z0-9_.-]+/(stop|start)$ }
    http-request deny
    default_backend dockerbackend
