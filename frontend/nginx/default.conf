# Sirve la aplicación (archivos estáticos de Vite). Traefik le envía todo lo que no empieza
# por /api, así que aquí no hay proxy hacia los microservicios.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;

    # Configuración en tiempo de ejecución: cambia con .env, nunca se guarda en caché.
    location = /config.js {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Los archivos de assets/ llevan un hash en el nombre: se pueden guardar un año.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # Aplicación de una sola página: /crear, /log, etc. devuelven index.html y React decide.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header X-Frame-Options DENY always;
        try_files $uri $uri/ /index.html;
    }
}
